name: Check VPN subscription

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xray-core
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          mkdir -p "$RUNNER_TEMP/xray"
          unzip -q /tmp/xray.zip xray -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          echo "$RUNNER_TEMP/xray" >> "$GITHUB_PATH"

      - name: Check nodes
        run: >-
          python3 scripts/check.py --xray xray --workers 40 --timeout 6
          --limit 3000 --attempts 2 --required 4
          --endpoint https://www.avito.ru/
          --endpoint https://vk.com/
          --endpoint https://rutube.ru/

      - name: Commit subscription and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sub.txt output/report.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update checked subscription"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $i), likely a concurrent run pushed first; re-committing on top of remote"
            git fetch origin main
            git reset --soft origin/main
            if git diff --cached --quiet; then
              echo "Remote already has identical output"
              exit 0
            fi
            git commit -m "chore: update checked subscription"
            sleep $((i * 10))
          done
          echo "Could not push after retries"
          exit 1
